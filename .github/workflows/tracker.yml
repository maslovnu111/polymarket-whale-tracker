name: Polymarket Whale Tracker
concurrency:
  group: whale-tracker
  cancel-in-progress: false

on:
  schedule:
    - cron: '*/5 * * * *'   # кожні 5 хвилин
  workflow_dispatch:          # можливість запустити вручну

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run tracker
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_AMOUNT: ${{ secrets.MIN_AMOUNT }}
        run: python tracker.py

            - name: Save state to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add last_check.json
          git diff --cached --quiet && echo "Немає змін" && exit 0
          git commit -m "Update last check"
          # Кілька спроб push з підтягуванням свіжих змін
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push успішний"
              exit 0
            fi
            echo "Push відхилено, спроба $i — підтягуємо зміни"
            git pull --rebase --autostash
            sleep 2
          done
          echo "Не вдалось запушити після 5 спроб"
          exit 1
