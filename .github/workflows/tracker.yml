name: Polymarket Whale Tracker

concurrency:
  group: whale-tracker
  # ОБОВ'ЯЗКОВО true. При false один запуск, що застряг у стані Queued
  # (GitHub не видав раннер), блокує ВСЮ чергу: наступні стають за ним і
  # скасовуються один за одним («Canceling since a higher priority waiting
  # request exists») — бот мовчить десятками хвилин.
  # З true новий запуск скасовує застряглий і сам займає його місце, тож
  # свіжий запуск завжди має шанс виконатись.
  # Втратити цикл не страшно: стан рухається лише після успіху, а вікно
  # агрегації (60 хв) і backfill перекривають будь-який пропуск.
  cancel-in-progress: true

on:
  # ОСНОВНИЙ тригер — зовнішній планувальник (cron-job.org) через
  # workflow_dispatch кожні 5 хв.
  #
  # Розклад нижче — лише СТРАХОВКА на випадок, якщо зовнішній планувальник
  # замовкне. Він навмисно рідкісний і зміщений з 5-хвилинної сітки (:07/:37),
  # щоб не збігатися із зовнішніми запусками: раніше тут стояло '*/5', обидва
  # джерела стріляли одночасно, запуски ставали в чергу concurrency-групи і
  # при будь-якій затримці GitHub каскадом скасовувались («No jobs were run»)
  # або падали зі «Startup failure».
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest
    # Завислий запуск має звільнити concurrency-групу ШВИДШЕ, ніж прийде
    # наступний (кожні 5 хв), інакше черга росте і запуски скасовуються.
    timeout-minutes: 4
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # Залежностей немає — tracker.py працює на стандартній бібліотеці Python.
      # Це прибрало крок `pip install` (мережева операція на кожному запуску,
      # ще одна причина падінь) і скоротило час запуску.

      - name: Run tracker
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_AMOUNT: ${{ secrets.MIN_AMOUNT }}
          # Необов'язкові налаштування (Repo Settings -> Secrets and variables ->
          # Actions -> Variables). Порожні значення = дефолти з коду.
          COMPONENT_MIN: ${{ vars.COMPONENT_MIN }}          # поріг шматка, $ (деф. 100000)
          AGG_WINDOW_MINUTES: ${{ vars.AGG_WINDOW_MINUTES }} # вікно агрегації, хв (деф. 60)
          TRACK_SELLS: ${{ vars.TRACK_SELLS }}               # 0 = не стежити за продажами (деф. 1)
          DAILY_DIGEST: ${{ vars.DAILY_DIGEST }}             # 0 = без щоденного підсумку (деф. 1)
          DAILY_DIGEST_HOUR: ${{ vars.DAILY_DIGEST_HOUR }}   # о котрій годині UTC слати підсумок (деф. 9)
          DIGEST_TOP: ${{ vars.DIGEST_TOP }}                 # скільки угод у підсумку (деф. 3)
          ENABLE_COMMANDS: ${{ vars.ENABLE_COMMANDS }}       # 0 = не відповідати на команди (деф. 1)
        run: python tracker.py

      - name: Save state to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # tracker.py щойно оновив last_check.json у робочій копії.
          if git diff --quiet -- last_check.json; then
            echo "Стан не змінився — нічого зберігати"
            exit 0
          fi

          # last_check.json — згенерований файл стану: найновіша версія завжди
          # правильна. Тому НЕ робимо rebase (він конфліктує), а на кожній гонці
          # просто перезаписуємо файл нашою свіжою версією і повторюємо push.
          cp last_check.json /tmp/state.json

          # timeout на мережевих операціях: зависла git-команда не має тримати
          # весь запуск (і concurrency-групу разом з ним).
          for i in 1 2 3; do
            timeout 60 git fetch origin main || true
            git reset --hard origin/main         # чиста копія найновішого main
            cp /tmp/state.json last_check.json   # накладаємо наш свіжий стан
            git add last_check.json
            if git diff --cached --quiet; then
              echo "Стан уже актуальний на origin — пушити нічого"
              exit 0
            fi
            git commit -m "Update last check"
            if timeout 60 git push origin HEAD:main; then
              echo "Стан збережено"
              exit 0
            fi
            echo "Гонка при push (спроба $i) — оновлюю main і повторюю"
            sleep $((RANDOM % 5 + 3))
          done

          # НЕ валимо джобу, щоб не приходив лист про помилку. Наступний запуск
          # наздожене пропущене вікно через last_timestamp.
          echo "::warning::Не вдалося зберегти стан після 3 спроб — наступний запуск наздожене"
          exit 0
