name: Verify coverage (temporary diagnostic)

# Тимчасовий workflow: запускається лише вручну, перевіряє повноту покриття
# на живих даних Polymarket. Секретів не потребує, стан не змінює.
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python verify_coverage.py
